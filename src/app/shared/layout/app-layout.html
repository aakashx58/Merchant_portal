<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">TechKraft</a>

  <nav>
    @if (auth.can(permission.application_create)) {
      <a mat-button routerLink="/wizard" routerLinkActive="active">New application</a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-button type="button" class="profile" [matMenuTriggerFor]="menu">
    <mat-icon>account_circle</mat-icon>
    <span class="name">{{ auth.user()?.username }}</span>
  </button>
  <mat-menu #menu="matMenu">
    <div class="menu-head">
      <strong>{{ auth.user()?.username }}</strong>
      <span class="role">{{ auth.roles().join(', ') }}</span>
    </div>
    <button mat-menu-item type="button" (click)="confirmSignOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
