<a class="skip-link" href="#main" (click)="focusMain($event)">Skip to main content</a>

<mat-toolbar class="toolbar">
  <button
    mat-icon-button
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="sidenav.opened"
    (click)="sidenav.toggle()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <a class="brand" routerLink="/">TechKraft</a>

  <span class="spacer"></span>

  <button
    mat-button
    type="button"
    class="profile"
    [attr.aria-label]="'Account menu for ' + auth.user()?.username"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon>account_circle</mat-icon>
    <span class="name">{{ auth.user()?.username }}</span>
  </button>
  <mat-menu #menu="matMenu">
    <div class="menu-head">
      <strong>{{ auth.user()?.username }}</strong>
      <span class="role">{{ auth.roles().join(', ') }}</span>
    </div>
    <button mat-menu-item type="button" (click)="confirmSignOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >
    <mat-nav-list aria-label="Main navigation" (click)="isMobile() && sidenav.close()">
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      @if (auth.can(permission.application_create)) {
        <a
          mat-list-item
          routerLink="/wizard"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <mat-icon matListItemIcon>add_circle</mat-icon>
          <span matListItemTitle>New application</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main #main id="main" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
