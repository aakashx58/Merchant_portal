<div class="bar">
  <h1>Dashboard</h1>
  <div class="filters">
    <div class="search-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input class="custom-input search-input" type="text" [formControl]="search" placeholder="Filter by technology..." />
    </div>

    <button mat-stroked-button class="filter-btn" [matMenuTriggerFor]="statusMenu">
      <mat-icon>filter_list</mat-icon>
      Status: {{ query().status || 'All' | titlecase }}
    </button>

    <mat-menu #statusMenu="matMenu">
      <button mat-menu-item (click)="setStatus('')">All</button>
      @for (s of statuses; track s) {
        <button mat-menu-item (click)="setStatus(s)">{{ s | titlecase }}</button>
      }
    </mat-menu>
  </div>
</div>

<app-data-table
  [columns]="columns()"
  [rows]="applications.value()?.items ?? []"
  [total]="applications.value()?.total ?? 0"
  [page]="query().page"
  [pageSize]="query().pageSize"
  [sort]="query().sort"
  [sortDir]="query().dir"
  [loading]="applications.isLoading()"
  [error]="!!applications.error()"
  emptyMessage="No applications match your filters."
  errorMessage="Could not load applications."
  (pageChange)="onPage($event)"
  (sortChange)="onSort($event)"
  (retry)="applications.reload()"
>
  <ng-template appCell="monthlyVolume" let-a>
    {{ a.monthlyVolume | currency: 'USD' : 'symbol' : '1.0-0' }}
  </ng-template>
  <ng-template appCell="updatedAt" let-a>{{ a.updatedAt | date: 'mediumDate' }}</ng-template>
  <ng-template appCell="assigneeName" let-a>{{ a.assigneeName || 'Unassigned' }}</ng-template>
  <ng-template appCell="actions" let-a>
    <button mat-button type="button" (click)="openDetails(a.id)">
      {{ canReview() && a.status === 'submitted' ? 'Review' : 'View' }}
    </button>
  </ng-template>
</app-data-table>
